<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet" />
</head>
<body>

<!-- Checkbox drives all state — NO JS -->
<input type="checkbox" id="toggle">

<div class="card">
  <div>

  <div class="btn-wrap">
    <div class="glow"></div>

    <label class="btn" for="toggle">
      <!-- Particles -->
      <div class="particles">
        <span class="p"></span><span class="p"></span><span class="p"></span>
        <span class="p"></span><span class="p"></span><span class="p"></span>
        <span class="p"></span><span class="p"></span><span class="p"></span>
        <span class="p"></span>
      </div>

      <!-- Bell icon -->
      <svg class="icon icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>

      <!-- Check icon -->
      <svg class="icon icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>

      <!-- Text -->
      <span style="position:relative; height:20px; width:100px; display:flex; align-items:center; justify-content:center;">
        <span class="t-placeholder">Subscribe</span>
        <span class="t-sub">Subscribe</span>
        <span class="t-done">Subscribed</span>
      </span>
    </label>
  </div>

</div>

</body>
</html>
